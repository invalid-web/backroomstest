let velocityY = 0, onGround = true, gameOver = false;

// ================= MAZE (real recursive-backtracker corridors) =================
// Each "chunk" is an NxN grid of maze cells. Cells are CELL_SIZE apart (corridor width).
// Walls between cells are thick boxes (office-wall style), not thin planes.
const CELL_SIZE = 3.2;          // corridor width - narrower = more hallway-like
const WALL_THICK = 0.45;        // thick office-style walls
const WALL_HEIGHT = 3.0, CEIL_Y = WALL_HEIGHT;
const MAZE_N = 8;               // 8x8 maze cells per chunk
const RENDER_RADIUS = 1;        // 3x3 chunks loaded at once
const MAX_CACHED_CHUNKS = 12;
const SEED = Math.floor(Math.random()*1000000);

function hash2(x, y, salt=0) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(salt, 2246822519) + SEED*2654435761;
  h = (h ^ (h >>> 13)) * 1274126177;
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967295;
}
function seededShuffle(arr, sx, sy, saltBase) {
  for (let i = arr.length-1; i>0; i--) {
    const r = hash2(sx*1000+i, sy*1000+saltBase, i);
    const j = Math.floor(r*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// Global open-passage graph: key "gx,gy" (global cell coords) -> Set of neighbor keys
const graph = new Map();
function gKey(gx,gy){ return gx+','+gy; }
function addEdge(gx1,gy1,gx2,gy2) {
  const k1=gKey(gx1,gy1), k2=gKey(gx2,gy2);
  if (!graph.has(k1)) graph.set(k1, new Set());
  if (!graph.has(k2)) graph.set(k2, new Set());
  graph.get(k1).add(k2);
  graph.get(k2).add(k1);
}

// Generate a perfect maze (iterative recursive-backtracker) for one chunk, deterministic per chunk coords
function generateMazeCells(chunkX, chunkY) {
  const N = MAZE_N;
  const visited = new Array(N*N).fill(false);
  const walls = new Array(N*N).fill(null).map(()=>({N:true,S:true,E:true,W:true}));
  const idx = (x,y)=>y*N+x;
  const stack = [[0,0]];
  visited[0]=true;
  let steps = 0;
  while (stack.length && steps < N*N*4) {
    steps++;
    const [cx,cy] = stack[stack.length-1];
    const neighbors = [];
    if (cy>0 && !visited[idx(cx,cy-1)]) neighbors.push(['N',cx,cy-1]);
    if (cy<N-1 && !visited[idx(cx,cy+1)]) neighbors.push(['S',cx,cy+1]);
    if (cx>0 && !visited[idx(cx-1,cy)]) neighbors.push(['W',cx-1,cy]);
    if (cx<N-1 && !visited[idx(cx+1,cy)]) neighbors.push(['E',cx+1,cy]);
    if (!neighbors.length) { stack.pop(); continue; }
    seededShuffle(neighbors, chunkX*97+cx, chunkY*97+cy, steps);
    const [dir,nx,ny] = neighbors[0];
    if (dir==='N') { walls[idx(cx,cy)].N=false; walls[idx(nx,ny)].S=false; }
    if (dir==='S') { walls[idx(cx,cy)].S=false; walls[idx(nx,ny)].N=false; }
    if (dir==='E') { walls[idx(cx,cy)].E=false; walls[idx(nx,ny)].W=false; }
    if (dir==='W') { walls[idx(cx,cy)].W=false; walls[idx(nx,ny)].E=false; }
    visited[idx(nx,ny)] = true;
    stack.push([nx,ny]);
  }
  return walls;
}

// Deterministic connector: for each chunk edge, open exactly one boundary cell to match neighbor chunk
function getConnectorIndex(chunkX, chunkY, edge) {
  // edge: 'E' (to chunkX+1), 'S' (to chunkY+1) -- computed once per edge pair, shared by both chunks
  const a = edge==='E' ? chunkX : chunkX;
  const b = edge==='E' ? chunkY : chunkY;
  return Math.floor(hash2(chunkX*3+ (edge==='E'?1:0), chunkY*3+(edge==='S'?1:0), 777) * MAZE_N);
}

// ================= CHUNK BUILD =================

const queuedSet = new Set();

function buildWallDoor() {
  const frameThick = 0.08, doorW = 0.9, doorH = 2.1;
  const doorGroup = new THREE.Group();
  const topBeam = new THREE.Mesh(new THREE.BoxGeometry(doorW+frameThick*2, frameThick, 0.14), whiteDoorFrameMat);
  topBeam.position.set(0, doorH+frameThick/2, 0);
  const leftBeam = new THREE.Mesh(new THREE.BoxGeometry(frameThick, doorH, 0.14), whiteDoorFrameMat);
  leftBeam.position.set(-doorW/2-frameThick/2, doorH/2, 0);
  const rightBeam = new THREE.Mesh(new THREE.BoxGeometry(frameThick, doorH, 0.14), whiteDoorFrameMat);
  rightBeam.position.set(doorW/2+frameThick/2, doorH/2, 0);
  doorGroup.add(topBeam, leftBeam, rightBeam);

  const pivot = new THREE.Group();
  pivot.position.set(-doorW/2, 0, 0);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(doorW, doorH, 0.06), whiteDoorPanelMat);
  panel.position.set(doorW/2, doorH/2, 0);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.04,8,8), doorFrameMat);
  knob.position.set(doorW-0.1, doorH/2, 0.05);
  panel.add(knob);
  pivot.add(panel);
  doorGroup.add(pivot);

  return {group: doorGroup, pivot, doorW};
}
function buildDoorFrame() {

  const topGeo = new THREE.BoxGeometry(1.1, 0.15, 0.15);

}
function buildStairway() {
  const g = new THREE.Group();
  const stepGeo = new THREE.BoxGeometry(1.0, 0.18, 0.32);

const specialRoomMats = {

function buildUpsideRoom(cx, cz, size) {
  const g = new THREE.Group();
  const half = size/2;
  for (let i=0;i<5;i++) {
    const fx = (Math.random()-0.5)*size*0.7, fz = (Math.random()-0.5)*size*0.7;
    const chair = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), specialRoomMats.ceilFurn);
    chair.position.set(cx+fx, CEIL_Y-0.3, cz+fz);
    chair.rotation.z = Math.PI;
    g.add(chair);
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.4,0.06), specialRoomMats.ceilFurn);
    leg.position.set(cx+fx, CEIL_Y-0.65, cz+fz);
    g.add(leg);
  }
  const table = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.1,0.8), specialRoomMats.ceilFurn);
  table.position.set(cx, CEIL_Y-0.15, cz);
  g.add(table);
  return g;
}

function buildEscherRoom(cx, cz, size) {
  const g = new THREE.Group();
  const stepGeo = new THREE.BoxGeometry(1.0,0.2,1.0);
  const count = 12;
  for (let i=0;i<count;i++) {
    const step = new THREE.Mesh(stepGeo, specialRoomMats.escherStep);
    const angle = (i/count)*Math.PI*2;
    const r = size*0.32;
    step.position.set(cx+Math.cos(angle)*r, 0.3+ (i%4)*0.5, cz+Math.sin(angle)*r);
    step.rotation.y = angle;
    step.rotation.x = 0.35;
    g.add(step);
  }
  return g;
}

const chairMat = new THREE.MeshStandardMaterial({color:0xf0ede0, roughness:0.6});

  const g = new THREE.Group();

  const back = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.5,0.05), chairMat);
  back.position.set(0,0.7,-0.19);
  g.add(seat, back);
  const legPositions = [[-0.18,-0.18],[0.18,-0.18],[-0.18,0.18],[0.18,0.18]];
  for (const [lx,lz] of legPositions) {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.45,0.04), chairMat);
    leg.position.set(lx,0.225,lz);
    g.add(leg);

  hourHand.position.set(0,0.06,0.04);
  const minHand = new THREE.Mesh(new THREE.BoxGeometry(0.02,0.22,0.02), anomalyMat.clockFrame);
  minHand.position.set(0,0.09,0.05);
  g.add(face, frame, hourHand, minHand);

  colliders.push({minX:cx-0.3,maxX:cx+0.3,minZ:cz-0.3,maxZ:cz+0.3});

function buildAbandonedCart(colliders, cx, cz) {
  const g = new THREE.Group();
  const basket = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.5,0.9), anomalyMat.cart);
  basket.position.y = 0.55;
  g.add(basket);
  const wheelGeo = new THREE.CylinderGeometry(0.08,0.08,0.06,10);
  const wheelPos = [[-0.25,-0.4],[0.25,-0.4],[-0.25,0.4],[0.25,0.4]];
  for (const [wx,wz] of wheelPos) {
    const wheel = new THREE.Mesh(wheelGeo, anomalyMat.cart);
    wheel.rotation.z = Math.PI/2;
    wheel.position.set(wx,0.08,wz);
    g.add(wheel);
  }
  colliders.push({minX:cx-0.35,maxX:cx+0.35,minZ:cz-0.5,maxZ:cz+0.5});
  return g;
}

const chessMat = {

function buildChessPawn(size) {

function buildChessKing(size) {

function buildChessRoom(cx, cz, size) {

function buildClassroomRoom(cx, cz, size) {

const SPECIAL_ROOM_BUILDERS = [buildUpsideRoom, buildEscherRoom, buildChessRoom, buildClassroomRoom];

function buildChunkData(chunkX, chunkY) {
  const chunkFlickerLights = [];
  const chunkDoors = [];
  const N = MAZE_N;
  const cellWalls = generateMazeCells(chunkX, chunkY);
  const idx = (x,y)=>y*N+x;
  const baseGX = chunkX*N, baseGY = chunkY*N;

  // Register graph edges for open (non-wall) passages within this chunk
  for (let x=0;x<N;x++) for (let y=0;y<N;y++) {
    const w = cellWalls[idx(x,y)];
    const gx = baseGX+x, gy = baseGY+y;
    if (!w.E && x<N-1) addEdge(gx,gy,gx+1,gy);
    if (!w.S && y<N-1) addEdge(gx,gy,gx,gy+1);
  }
  // Connectors to neighbor chunks (open one boundary wall each direction, mirrored on neighbor build)
  const connE = getConnectorIndex(chunkX,chunkY,'E');
  const connS = getConnectorIndex(chunkX,chunkY,'S');
  cellWalls[idx(N-1,connE)].E = false;
  cellWalls[idx(connS,N-1)].S = false;
  addEdge(baseGX+N-1, baseGY+connE, baseGX+N, baseGY+connE);
  addEdge(baseGX+connS, baseGY+N-1, baseGX+connS, baseGY+N);
  // Also open our own west/north side to match neighbor's connector (mirror calc using neighbor's coords)
  const connWfromNeighbor = getConnectorIndex(chunkX-1,chunkY,'E');
  cellWalls[idx(0,connWfromNeighbor)].W = false;
  const connNfromNeighbor = getConnectorIndex(chunkX,chunkY-1,'S');
  cellWalls[idx(connNfromNeighbor,0)].N = false;

  // Carve a rare special liminal room: merge a 2x2 cell block into one open room
  let specialRoom = null;
  const isStartChunk = (chunkX === 0 && chunkY === 0);
  if (isStartChunk || hash2(chunkX, chunkY, 999) < 0.4) {
    const rx = isStartChunk ? 1 : 1 + Math.floor(hash2(chunkX,chunkY,1000)*(N-3));
    const ry = isStartChunk ? 1 : 1 + Math.floor(hash2(chunkX,chunkY,1001)*(N-3));
    cellWalls[idx(rx,ry)].E = false; cellWalls[idx(rx+1,ry)].W = false;
    cellWalls[idx(rx,ry)].S = false; cellWalls[idx(rx,ry+1)].N = false;
    cellWalls[idx(rx+1,ry)].S = false; cellWalls[idx(rx+1,ry+1)].N = false;
    cellWalls[idx(rx,ry+1)].E = false; cellWalls[idx(rx+1,ry+1)].W = false;
    addEdge(baseGX+rx,baseGY+ry, baseGX+rx+1,baseGY+ry);
    addEdge(baseGX+rx,baseGY+ry, baseGX+rx,baseGY+ry+1);
    addEdge(baseGX+rx+1,baseGY+ry, baseGX+rx+1,baseGY+ry+1);
    addEdge(baseGX+rx,baseGY+ry+1, baseGX+rx+1,baseGY+ry+1);
    const roomCenterX = (baseGX+rx+1)*CELL_SIZE;
    const roomCenterZ = (baseGY+ry+1)*CELL_SIZE;
    const builderIdx = isStartChunk
      ? SPECIAL_ROOM_BUILDERS.indexOf(buildChessRoom)
      : Math.floor(hash2(chunkX,chunkY,1002)*SPECIAL_ROOM_BUILDERS.length);
    specialRoom = {builder: SPECIAL_ROOM_BUILDERS[builderIdx], cx: roomCenterX, cz: roomCenterZ, size: CELL_SIZE*2};
    if (isStartChunk) {
      window.__startRoomCenter = {x: roomCenterX, z: roomCenterZ};
    }
  }

  const floorGeos=[], ceilGeos=[], wallGeos=[];
  const colliders = [];
  const signs = [];
  const halfCS = CELL_SIZE/2;

  const baseFloorGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);
  const baseCeilGeo = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);

  for (let x=0;x<N;x++) {
    for (let y=0;y<N;y++) {
      const w = cellWalls[idx(x,y)];
      const wx = (baseGX+x)*CELL_SIZE, wz = (baseGY+y)*CELL_SIZE;
      const ccx = wx+halfCS, ccz = wz+halfCS;

      const fg = baseFloorGeo.clone();
      fg.rotateX(-Math.PI/2); fg.translate(ccx,0,ccz);
      floorGeos.push(fg);
      const cg = baseCeilGeo.clone();
      cg.rotateX(Math.PI/2); cg.translate(ccx,CEIL_Y,ccz);
      ceilGeos.push(cg);

      // Thick box walls (office-style), placed at cell edges, matching collider exactly
      if (w.N) {
        const g = new THREE.BoxGeometry(CELL_SIZE+WALL_THICK, WALL_HEIGHT, WALL_THICK);
        g.translate(ccx, WALL_HEIGHT/2, wz);
        wallGeos.push(g);
        colliders.push({minX:wx-WALL_THICK/2,maxX:wx+CELL_SIZE+WALL_THICK/2,minZ:wz-WALL_THICK/2,maxZ:wz+WALL_THICK/2});
      }
      if (w.S) {
        const g = new THREE.BoxGeometry(CELL_SIZE+WALL_THICK, WALL_HEIGHT, WALL_THICK);
        g.translate(ccx, WALL_HEIGHT/2, wz+CELL_SIZE);
        wallGeos.push(g);
        colliders.push({minX:wx-WALL_THICK/2,maxX:wx+CELL_SIZE+WALL_THICK/2,minZ:wz+CELL_SIZE-WALL_THICK/2,maxZ:wz+CELL_SIZE+WALL_THICK/2});
      }
      if (w.W) {
        const g = new THREE.BoxGeometry(WALL_THICK, WALL_HEIGHT, CELL_SIZE+WALL_THICK);
        g.translate(wx, WALL_HEIGHT/2, ccz);
        wallGeos.push(g);
        colliders.push({minX:wx-WALL_THICK/2,maxX:wx+WALL_THICK/2,minZ:wz-WALL_THICK/2,maxZ:wz+CELL_SIZE+WALL_THICK/2});
      }
      if (w.E) {
        const g = new THREE.BoxGeometry(WALL_THICK, WALL_HEIGHT, CELL_SIZE+WALL_THICK);
        g.translate(wx+CELL_SIZE, WALL_HEIGHT/2, ccz);
        wallGeos.push(g);
        colliders.push({minX:wx+CELL_SIZE-WALL_THICK/2,maxX:wx+CELL_SIZE+WALL_THICK/2,minZ:wz-WALL_THICK/2,maxZ:wz+CELL_SIZE+WALL_THICK/2});
      }
    }
  }
  baseFloorGeo.dispose(); baseCeilGeo.dispose();

  const group = new THREE.Group();
  if (floorGeos.length) {
    const fm = mergeGeometries(floorGeos, false);
    group.add(new THREE.Mesh(fm, floorMat));
    floorGeos.forEach(g=>g.dispose());
    const cm = mergeGeometries(ceilGeos, false);
    group.add(new THREE.Mesh(cm, ceilMat));
    ceilGeos.forEach(g=>g.dispose());
  }
  if (wallGeos.length) {
    const wm = mergeGeometries(wallGeos, false);
    group.add(new THREE.Mesh(wm, wallMat));
    wallGeos.forEach(g=>g.dispose());
  }

  // Sparse lighting + exit signs, placed at open cell centers only
  for (let x=0;x<N;x++) for (let y=0;y<N;y++) {
    const wx=(baseGX+x)*CELL_SIZE, wz=(baseGY+y)*CELL_SIZE, ccx=wx+halfCS, ccz=wz+halfCS;
    if (hash2(baseGX+x,baseGY+y,11) < 0.06) {
      const bulb = new THREE.PointLight(0xfff6c8, 0.18, 3.5, 2);
      bulb.position.set(ccx, CEIL_Y-0.15, ccz);
      group.add(bulb);
      if (hash2(baseGX+x,baseGY+y,88) < 0.35) chunkFlickerLights.push(bulb);
    }
    if (hash2(baseGX+x,baseGY+y,444) < 0.02) group.add(buildChairPile(ccx, ccz, colliders));
    if (hash2(baseGX+x,baseGY+y,555) < 0.012) {
      const clock = buildWallClock();
      const w2 = cellWalls[idx(x,y)];
      if (!w2.N) clock.position.set(ccx, 1.9, wz+0.08);
      else if (!w2.S) { clock.position.set(ccx, 1.9, wz+CELL_SIZE-0.08); clock.rotation.y = Math.PI; }
      else if (!w2.E) { clock.position.set(wx+CELL_SIZE-0.08, 1.9, ccz); clock.rotation.y = -Math.PI/2; }
      else { clock.position.set(wx+0.08, 1.9, ccz); clock.rotation.y = Math.PI/2; }
      group.add(clock);
    }
    if (hash2(baseGX+x,baseGY+y,666) < 0.008) group.add(buildMannequin(colliders, ccx, ccz));
    if (hash2(baseGX+x,baseGY+y,777) < 0.007) group.add(buildAbandonedCart(colliders, ccx, ccz));
    if (hash2(baseGX+x,baseGY+y,888) < 0.012) {
      const w3 = cellWalls[idx(x,y)];
      let placedWall = w3.N ? 'N' : w3.S ? 'S' : w3.E ? 'E' : w3.W ? 'W' : null;
      if (placedWall) {
        const doorObj = buildWallDoor();
        const doorW = doorObj.doorW;
        let doorCX, doorCZ, doorRotY, colliderBox;
        if (placedWall === 'N') {
          doorCX = ccx; doorCZ = wz; doorRotY = 0;
          colliderBox = {minX: ccx-doorW/2, maxX: ccx+doorW/2, minZ: wz-0.1, maxZ: wz+0.1};
        } else if (placedWall === 'S') {
          doorCX = ccx; doorCZ = wz+CELL_SIZE; doorRotY = Math.PI;
          colliderBox = {minX: ccx-doorW/2, maxX: ccx+doorW/2, minZ: wz+CELL_SIZE-0.1, maxZ: wz+CELL_SIZE+0.1};
        } else if (placedWall === 'E') {
          doorCX = wx+CELL_SIZE; doorCZ = ccz; doorRotY = -Math.PI/2;
          colliderBox = {minX: wx+CELL_SIZE-0.1, maxX: wx+CELL_SIZE+0.1, minZ: ccz-doorW/2, maxZ: ccz+doorW/2};
        } else {
          doorCX = wx; doorCZ = ccz; doorRotY = Math.PI/2;
          colliderBox = {minX: wx-0.1, maxX: wx+0.1, minZ: ccz-doorW/2, maxZ: ccz+doorW/2};
        }
        doorObj.group.position.set(doorCX, 0, doorCZ);
        doorObj.group.rotation.y = doorRotY;
        group.add(doorObj.group);
        colliders.push(colliderBox);
        chunkDoors.push({pivot: doorObj.pivot, isOpen:false, currentAngle:0, collider:colliderBox, worldX:doorCX, worldZ:doorCZ});
      }
    }
    // Liminal doorframes in weird random spots (standalone, not blocking passage)
    if (hash2(baseGX+x,baseGY+y,222) < 0.01) {
      const frame = buildDoorFrame();
      frame.position.set(ccx, 0, ccz);
      frame.rotation.y = Math.floor(hash2(baseGX+x,baseGY+y,223)*4) * (Math.PI/2);
      group.add(frame);
    }
    // Liminal stairway fragments (going nowhere, purely atmospheric)
    if (hash2(baseGX+x,baseGY+y,333) < 0.006) {
      const stair = buildStairway();
      stair.position.set(ccx, 0, ccz);
      stair.rotation.y = Math.floor(hash2(baseGX+x,baseGY+y,334)*4) * (Math.PI/2);
      group.add(stair);
    }
    if (hash2(baseGX+x,baseGY+y,55) < 0.008) {
      const w = cellWalls[idx(x,y)];
      const facing = !w.N ? 'N' : !w.S ? 'S' : !w.E ? 'E' : 'W';
      const sign = new THREE.Mesh(signGeo, makeSignMaterials());
      if (facing==='N') { sign.position.set(ccx,1.7,wz+0.3); sign.rotation.y = 0; }
      else if (facing==='S') { sign.position.set(ccx,1.7,wz+CELL_SIZE-0.3); sign.rotation.y=Math.PI; }
      else if (facing==='E') { sign.position.set(wx+CELL_SIZE-0.3,1.7,ccz); sign.rotation.y=-Math.PI/2; }
      else { sign.position.set(wx+0.3,1.7,ccz); sign.rotation.y=Math.PI/2; }
      group.add(sign);
      const glow = new THREE.PointLight(0xff2222, 0.9, 3.5, 2);
      glow.position.copy(sign.position);
      group.add(glow);
      signs.push({mesh:sign, glow:glow, worldX:ccx, worldZ:ccz, found:false});
    }
  }

  if (specialRoom) {
    const roomMesh = specialRoom.builder(specialRoom.cx, specialRoom.cz, specialRoom.size);
    group.add(roomMesh);
    if (specialRoom.builder === buildEscherRoom || specialRoom.builder === buildChessRoom) {
      const roomLight = new THREE.PointLight(0xbfd8ff, 0.9, specialRoom.size*1.5, 2);
      roomLight.position.set(specialRoom.cx, CEIL_Y-0.3, specialRoom.cz);
      group.add(roomLight);
    }
  }

  return {group, colliders, signs, flickerLights: chunkFlickerLights, doors: chunkDoors};
}

function commitChunk(chunkX, chunkY, data) {
  scene.add(data.group);
  chunks.set(chunkKey(chunkX,chunkY), {...data, lastUsed: performance.now()});
  for (const s of data.signs) allSigns.push(s);
  for (const d of data.doors) allDoors.push(d);
}
function pruneSignsForChunk(chunkX, chunkY) {
  const baseGX = chunkX*MAZE_N*CELL_SIZE, baseGY = chunkY*MAZE_N*CELL_SIZE;
  const size = MAZE_N*CELL_SIZE;
  for (let i=allSigns.length-1;i>=0;i--) {
    const s = allSigns[i];
    if (s.worldX >= baseGX && s.worldX < baseGX+size && s.worldZ >= baseGY && s.worldZ < baseGY+size) {
      allSigns.splice(i,1);
    }
  }
}
function removeChunk(key) {
  const c = chunks.get(key);
  if (!c) return;
  scene.remove(c.group);
  c.group.traverse(o=>{ if(o.isMesh) o.geometry.dispose(); });
  chunks.delete(key);
  const [ccx, ccy] = key.split(',').map(Number);
  const baseGX = ccx*MAZE_N, baseGY = ccy*MAZE_N;
  for (let x=0;x<MAZE_N;x++) for (let y=0;y<MAZE_N;y++) {
    const gx = baseGX+x, gy = baseGY+y;
    const k = gKey(gx,gy);
    const neighbors = graph.get(k);
    if (neighbors) {
      for (const n of neighbors) {
        const nSet = graph.get(n);
        if (nSet) nSet.delete(k);
      }
      graph.delete(k);
    }
  }
  pruneSignsForChunk(ccx, ccy);
  const doorBaseGX = ccx*MAZE_N*CELL_SIZE, doorBaseGY = ccy*MAZE_N*CELL_SIZE;
  const doorSize = MAZE_N*CELL_SIZE;
  for (let i=allDoors.length-1;i>=0;i--) {
    const d = allDoors[i];
    if (d.worldX >= doorBaseGX && d.worldX < doorBaseGX+doorSize && d.worldZ >= doorBaseGY && d.worldZ < doorBaseGY+doorSize) {
      allDoors.splice(i,1);
    }
  }
}

const FRAME_BUILD_BUDGET_MS = 5;
const MAX_CHUNKS_PER_FRAME = 1;
function processBuildQueue() {
  const start = performance.now();
  let built = 0;
  while (buildQueue.length && built < MAX_CHUNKS_PER_FRAME && performance.now()-start < FRAME_BUILD_BUDGET_MS) {
    const [cx,cy] = buildQueue.shift();
    const key = chunkKey(cx,cy);
    queuedSet.delete(key);
    if (chunks.has(key)) continue;
    commitChunk(cx,cy, buildChunkData(cx,cy));
    built++;
  }
}
function requestChunks(px,pz) {
  const chunkX = Math.floor(px/(CELL_SIZE*MAZE_N));
  const chunkY = Math.floor(pz/(CELL_SIZE*MAZE_N));
  const needed = new Set();
  for (let dx=-RENDER_RADIUS; dx<=RENDER_RADIUS; dx++) for (let dy=-RENDER_RADIUS; dy<=RENDER_RADIUS; dy++) {
    const cx=chunkX+dx, cy=chunkY+dy, key=chunkKey(cx,cy);
    needed.add(key);
    if (!chunks.has(key) && !queuedSet.has(key)) { buildQueue.push([cx,cy]); queuedSet.add(key); }
    else if (chunks.has(key)) chunks.get(key).lastUsed = performance.now();
  }
  for (const key of Array.from(chunks.keys())) if (!needed.has(key)) removeChunk(key);
  if (chunks.size > MAX_CACHED_CHUNKS) {
    const sorted = Array.from(chunks.entries()).sort((a,b)=>a[1].lastUsed-b[1].lastUsed);
    while (chunks.size > MAX_CACHED_CHUNKS) removeChunk(sorted.shift()[0]);
  }
}

// ================= COLLISION =================
const PLAYER_RADIUS = 0.3;
function resolveCollisions(pos) {
  const chunkX = Math.floor(pos.x/(CELL_SIZE*MAZE_N));
  const chunkY = Math.floor(pos.z/(CELL_SIZE*MAZE_N));
  const nearbyBoxes = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) {
    const c = chunks.get(chunkKey(chunkX+dx, chunkY+dy));
    if (!c) continue;
    for (const box of c.colliders) nearbyBoxes.push(box);
  }
  for (let iter=0; iter<3; iter++) {
    let anyCollision = false;
    for (const box of nearbyBoxes) {
      const closestX = Math.max(box.minX, Math.min(pos.x, box.maxX));
      const closestZ = Math.max(box.minZ, Math.min(pos.z, box.maxZ));
      const ddx = pos.x-closestX, ddz = pos.z-closestZ;
      const distSq = ddx*ddx+ddz*ddz;
      if (distSq < PLAYER_RADIUS*PLAYER_RADIUS && distSq > 1e-6) {
        anyCollision = true;
        const dist = Math.sqrt(distSq);
        const overlap = PLAYER_RADIUS - dist;
        pos.x += (ddx/dist)*overlap;
        pos.z += (ddz/dist)*overlap;
      }
    }
    if (!anyCollision) break;
  }
}

function worldToCell(x,z) { return [Math.floor(x/CELL_SIZE), Math.floor(z/CELL_SIZE)]; }
function cellCenter(gx,gz) { return [gx*CELL_SIZE+CELL_SIZE/2, gz*CELL_SIZE+CELL_SIZE/2]; }

function bfsPath(startKey, goalKey, maxNodes=400) {
  if (startKey===goalKey) return [];
  const visited = new Set([startKey]);
  const queue = [[startKey, []]];
  let checked = 0;
  while (queue.length && checked < maxNodes) {
    checked++;
    const [cur, path] = queue.shift();
    const neighbors = graph.get(cur);
    if (!neighbors) continue;
    for (const n of neighbors) {
      if (visited.has(n)) continue;
      const newPath = path.concat([n]);
      if (n===goalKey) return newPath;
      visited.add(n);
      queue.push([n, newPath]);
    }
  }
  return null;
}

function spawnEntity(playerPos) {

function playInsanityWhisper() {

  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    const p = i / bufferSize;
    const envelope = Math.sin(p * Math.PI);

  }

  const gain = audioCtx.createGain();

}

  const data = buffer.getChannelData(0);

function playChime() {
  if (!audioCtx) return;
  const notes = [880, 1174.66, 1567.98];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.value = 0.0001;
    osc.connect(gain).connect(audioCtx.destination);
    const startAt = audioCtx.currentTime + i*0.09;
    osc.start(startAt);
    gain.gain.exponentialRampToValueAtTime(0.12, startAt+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt+0.5);
    osc.stop(startAt+0.55);
  });
}

function spawnRuntimeAnomaly(playerPos) {
  const cx = Math.floor(playerPos.x/(CELL_SIZE*MAZE_N));
  const cz = Math.floor(playerPos.z/(CELL_SIZE*MAZE_N));
  const chunk = chunks.get(chunkKey(cx,cz));
  if (!chunk || !chunk.group) return;
  const ox = playerPos.x + (Math.random()-0.5)*6;
  const oz = playerPos.z + (Math.random()-0.5)*6;

  const roll = Math.random();
  let obj = null;
  let collider = null;
  let audioOnly = false;

  if (roll < 0.2) {
    // Visual-only: hanging panels, no collider, purely atmospheric
    obj = buildHangingPanelsAnomaly();
  } else if (roll < 0.45) {
    // Physical: broken TV, blocks movement
    obj = buildBrokenTVAnomaly();
    collider = {minX:ox-0.45, maxX:ox+0.45, minZ:oz-0.35, maxZ:oz+0.35};
  } else if (roll < 0.65) {
    // Physical: tilted lamp, blocks movement
    obj = buildTiltedLampAnomaly();
    collider = {minX:ox-0.25, maxX:ox+0.25, minZ:oz-0.25, maxZ:oz+0.25};
  } else if (roll < 0.85) {
    // Visual-only: shifted wall segment, no collider (purely disorienting, doesn't actually block)
    obj = buildShiftedWallAnomaly();
  } else {
    // Audio-only: disembodied sound, no mesh at all
    audioOnly = true;
  }

  if (audioOnly) {
    if (audioCtx) playInsanityWhisper();
    return;
  }

  obj.position.set(ox, 0, oz);
  chunk.group.add(obj);
  if (collider) chunk.colliders.push(collider);

  activeAnomalies.push({obj, chunkRef: chunk, collider, spawnedAt: performance.now()});
  if (activeAnomalies.length > 14) {
    const old = activeAnomalies.shift();
    old.chunkRef.group.remove(old.obj);
    if (old.collider) {
      const i = old.chunkRef.colliders.indexOf(old.collider);
      if (i !== -1) old.chunkRef.colliders.splice(i,1);
    }
  }
}

  const combinedChance = Math.max(0, insanityFactor - 0.15) * 0.7 + timeFactor * 0.25;
  if (anomalySpawnCooldown <= 0 && combinedChance > 0) {
    if (Math.random() < combinedChance) spawnRuntimeAnomaly(playerPos);
    anomalySpawnCooldown = 3 + Math.random()*4;

}

function animate() {

  renderer.setRenderTarget(null);
  renderer.render(screenScene, screenCamera); return; }
  const delta = Math.min(clock.getDelta(), 0.05);

  processBuildQueue();

  for (const d of allDoors) {
    d.targetAngle = d.isOpen ? -Math.PI/2 * 0.92 : 0;
    d.currentAngle += (d.targetAngle - d.currentAngle) * Math.min(1, delta*6);
    d.pivot.rotation.y = d.currentAngle;
    const openEnough = Math.abs(d.currentAngle) > 0.6;
    if (openEnough && !d.colliderDisabled) {
      const i = d.collider ? undefined : undefined;
    }
    if (openEnough && d.collider && !d.collider.__disabled) {
      d.collider.__savedMinX = d.collider.minX; d.collider.__savedMaxX = d.collider.maxX;
      d.collider.__savedMinZ = d.collider.minZ; d.collider.__savedMaxZ = d.collider.maxZ;
      d.collider.minX = d.collider.maxX = d.collider.minZ = d.collider.maxZ = -99999;
      d.collider.__disabled = true;
    } else if (!openEnough && d.collider && d.collider.__disabled) {
      d.collider.minX = d.collider.__savedMinX; d.collider.maxX = d.collider.__savedMaxX;
      d.collider.minZ = d.collider.__savedMinZ; d.collider.maxZ = d.collider.__savedMaxZ;
      d.collider.__disabled = false;
    }
  }

  const hueShift=(Math.sin(t*0.05)+1)*0.012;
  const drifted = BASE_FOG.clone().offsetHSL(hueShift,0,Math.sin(t*0.07)*0.015);
  scene.fog.color.copy(drifted);
  scene.background.copy(drifted);
  camera.fov = 74 + Math.sin(t*0.15)*0.8;
  camera.updateProjectionMatrix();

  if (controls.isLocked) {
    const speed = (keys['ShiftLeft']||keys['ShiftRight']) ? SPRINT_SPEED : WALK_SPEED;
    dir.set(0,0,0);
    if (keys['KeyW']) dir.z -= 1;
    if (keys['KeyS']) dir.z += 1;
    if (keys['KeyA']) dir.x -= 1;
    if (keys['KeyD']) dir.x += 1;
    if (dir.lengthSq()>0) dir.normalize();

    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y=0; forward.normalize();
    const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize();
    const moveVec = new THREE.Vector3();
    moveVec.addScaledVector(forward, -dir.z);
    moveVec.addScaledVector(right, dir.x);
    const isMoving = moveVec.lengthSq() > 0;
    if (isMoving) moveVec.normalize().multiplyScalar(speed*delta);

    const obj = controls.getObject();
    obj.position.x += moveVec.x;
    obj.position.z += moveVec.z;
    resolveCollisions(obj.position);

    if (keys['Space'] && onGround) { velocityY = JUMP_SPEED; onGround=false; }
    velocityY -= GRAVITY*delta;
    obj.position.y += velocityY*delta;
    if (obj.position.y <= EYE_HEIGHT) {
      obj.position.y = EYE_HEIGHT;
      velocityY = 0;
      onGround = true;
    }

    // Natural flashlight + camera bob while walking on ground
    const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
    if (isMoving && onGround) {
      bobPhase += delta * (isSprinting ? 14 : 9);
      const bobAmt = isSprinting ? 0.055 : 0.03;
      flashlight.position.y = 0.15 + Math.sin(bobPhase) * bobAmt;
      flashlight.position.x = Math.cos(bobPhase*0.5) * bobAmt * 0.6;
    } else {
      bobPhase = 0;
      flashlight.position.y += (0.15 - flashlight.position.y) * 0.15;
      flashlight.position.x += (0 - flashlight.position.x) * 0.15;
    }

    // Footstep audio: gentle walk, louder/faster when sprinting
    if (isMoving && onGround) {
      const stepInterval = isSprinting ? 0.28 : 0.46;
      footstepTimer -= delta;
      if (footstepTimer <= 0) {
        playFootstep(isSprinting);
        footstepTimer = stepInterval;
      }
    } else {
      footstepTimer = 0;
    }

    flicker.position.set(obj.position.x, obj.position.y+0.9, obj.position.z);
    flicker.intensity = 1.0 + Math.sin(t*10)*0.1 + (Math.random()-0.5)*0.05;

    // Hallway flickering lights (subset of bulbs), independent random flicker
    // Only iterate currently loaded chunks -- prevents unbounded growth as chunks stream in/out
    for (const c of chunks.values()) {
      for (const fl of c.flickerLights) {
        if (Math.random() < 0.02) fl.intensity = 0.05;
        else if (Math.random() < 0.1) fl.intensity = 0.7 + Math.random()*0.3;
      }
    }

    // Flashlight rare flicker
    if (flashMode > 0) {
      flashFlickerTimer -= delta;
      if (flashFlickerTimer <= 0) {
        const modeAtFlicker = flashMode;
        flashlight.intensity = FLASHLIGHT_BASE_INTENSITY * 0.15;
        setTimeout(()=>{ if(flashMode === modeAtFlicker) flashlight.intensity = FLASHLIGHT_BASE_INTENSITY; }, 90+Math.random()*120);
        flashFlickerTimer = 4 + Math.random()*7;
      }
    }

    requestChunks(obj.position.x, obj.position.z);
    cellSpan.textContent = Math.floor(obj.position.x/CELL_SIZE)+','+Math.floor(obj.position.z/CELL_SIZE);

    for (const s of allSigns) {
      if (s.found) continue;
      const dxs = obj.position.x - s.worldX, dzs = obj.position.z - s.worldZ;
      if (dxs*dxs+dzs*dzs < 2.2*2.2) {
        s.found = true; foundCount++; foundSpan.textContent = foundCount;
        if (s.mesh.parent) s.mesh.parent.remove(s.mesh);
        if (s.glow && s.glow.parent) s.glow.parent.remove(s.glow);
        playChime();
      }
    }

    entitySpawnTimer -= delta;
    if (!entityActive && entitySpawnTimer <= 0) spawnEntity(obj.position);

    if (entityActive) {
      if (t - lastPathCompute > 0.5) {
        lastPathCompute = t;
        const [pgx,pgz] = worldToCell(obj.position.x, obj.position.z);
        const startKey = gKey(entityGX, entityGZ);
        const goalKey = gKey(pgx,pgz);
        const path = bfsPath(startKey, goalKey, 500);
        currentPath = path || [];
      }
      if (!pathTarget && currentPath.length) {
        const [ngx,ngz] = currentPath[0].split(',').map(Number);
        pathTarget = {gx:ngx, gz:ngz};
      }
      if (pathTarget) {
        const [tx,tz] = cellCenter(pathTarget.gx, pathTarget.gz);
        const ddx = tx-entityPos.x, ddz = tz-entityPos.z;
        const dd = Math.sqrt(ddx*ddx+ddz*ddz);
        const chaseSpeed = 2.4;
        if (dd < 0.15) {
          entityGX = pathTarget.gx; entityGZ = pathTarget.gz;
          currentPath.shift();
          pathTarget = null;
        } else {
          entityPos.x += (ddx/dd)*chaseSpeed*delta;
          entityPos.z += (ddz/dd)*chaseSpeed*delta;
        }
      }
      entity.position.set(entityPos.x, 1.0, entityPos.z);
      entity.lookAt(obj.position.x, 1.0, obj.position.z);

      const toPlayer = new THREE.Vector3(obj.position.x-entityPos.x, 0, obj.position.z-entityPos.z);
      const distToPlayer = toPlayer.length();
      const proximity = Math.max(0, 1 - distToPlayer/14);
      const HEARING_DISTANCE = 22;
      if (distToPlayer > HEARING_DISTANCE) { sanity = Math.min(100, sanity + 4*delta); }
      else { sanity -= proximity*16*delta; }
      sanity = Math.max(0, Math.min(100, sanity));
      insanityFactor = (100 - sanity) / 100;
      updateSanityUI(sanity);
      vignette.style.opacity = Math.min(0.85, (1-sanity/100)*0.9 + proximity*0.3);

      if (distToPlayer < 13 && t-lastHeartbeat > Math.max(0.3, distToPlayer/11)) {
        heartbeatPulse(proximity+0.3); lastHeartbeat = t;
      }
      if (distToPlayer < 1.0) triggerJumpscare();

      if (staticGain) {
        const targetGain = distToPlayer > 16 ? 0 : proximity*proximity*0.5;
        staticGain.gain.value += (targetGain - staticGain.gain.value)*0.1;
        staticFilter.frequency.value = 1200 + proximity*2500 + (Math.random()-0.5)*300;
      }
      const distortAmt = proximity*proximity;
      smoothedDistort += (distortAmt - smoothedDistort) * 0.08;
      applyDistortion(smoothedDistort, t);

      if (distToPlayer > 45) {
        entityActive = false; entity.visible = false;
        entitySpawnTimer = 14 + Math.random()*12;
        sanity = Math.min(100, sanity+10);
        currentPath = []; pathTarget = null;
      }
    } else {
      sanity = Math.min(100, sanity + 5*delta);
      insanityFactor = (100 - sanity) / 100;
      updateSanityUI(sanity);
      const cur = parseFloat(vignette.style.opacity)||0;
      vignette.style.opacity = Math.max(0, cur-delta*0.3);
      if (staticGain) staticGain.gain.value += (0 - staticGain.gain.value)*0.1;
      smoothedDistort += (0 - smoothedDistort) * 0.08;
      applyDistortion(smoothedDistort, t);
    }
  }

  // --- Insanity-driven sensory distortion (feature 1) ---
  if (insanityFactor > 0.02 && camera) {
    const wobble = insanityFactor * 0.005;
    camera.rotation.z += (Math.sin(t*4.3)*wobble - camera.rotation.z*0.02) * 0.15;
    const insanityDistort = insanityFactor * insanityFactor * 0.6;
    smoothedDistort = Math.max(smoothedDistort, smoothedDistort + (insanityDistort - smoothedDistort) * 0.03);
    applyDistortion(smoothedDistort, t);
    if (audioCtx && Math.random() < insanityFactor * 0.006) playInsanityWhisper();
    if (controls && controls.getObject) {
      updateAnomalies(delta, controls.getObject().position);
    }
  }
  updatePixiOverlay(delta);

  frameCount++; fpsAccum += delta;
  if (fpsAccum >= 0.5) { fpsSpan.textContent = Math.round(frameCount/fpsAccum); frameCount=0; fpsAccum=0; }
  renderer.setRenderTarget(lowResTarget);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(screenScene, screenCamera);
}
animate();
</script>
